<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoreCore</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modes.css">
  <style>
    .tbtn { display:none; }
    @media (max-width:900px){
      .tbtn{
        display:inline-flex;align-items:center;justify-content:center;
        width:28px;height:28px;border:1px solid var(--border);background:transparent;
        color:var(--tx2);cursor:pointer;font-size:14px;border-radius:var(--r);margin-left:4px;
      }
      .tbtn:hover{border-color:var(--ac);color:var(--tx)}
    }
  </style>
</head>
<body data-mode="library">
  <div class="shell">
    <div class="top">
      <div class="brand">LORE<span> CORE</span></div>
      <div class="modes">
        <button class="mode" data-mode="library">Library</button>
        <button class="mode" data-mode="author">Author</button>
        <button class="mode" data-mode="qc">QC</button>
        <button class="mode" data-mode="kilder">Kilder</button>
      </div>
      <div class="spacer">
        <button class="tbtn" data-panel="rail" aria-label="Toggle sidebar">&#9776;</button>
        <button class="tbtn" data-panel="ctx" aria-label="Toggle context">&#10710;</button>
      </div>
      <div class="uni">UNIVERSE <b>UNI-GALDURDAL</b></div>
    </div>
    <div class="longrun" hidden>
      <span class="lr-dot"></span>
      <span class="lr-name">PR-xxx</span>
      <span class="lr-where">chapters &middot; kap 5</span>
      <span class="lr-track"><span class="lr-fill" style="width:0%"></span></span>
      <span class="lr-eta">~12 min</span>
    </div>
    <div class="body">
      <div class="rail" id="rail"></div>
      <div class="main" id="main"></div>
      <div class="ctx" id="ctx"></div>
    </div>
  </div>
  <script type="module" src="js/shell.js"></script>
  <noscript>
    <p style="text-align:center;padding:2rem;font-family:sans-serif">
      LoreCore krever JavaScript.
    </p>
  </noscript>
</body>
</html>
